<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeachX sim — sky and weather look (developer page)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; }
      #hud { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 6px; white-space: pre; font-family: ui-monospace, monospace; font-size: 11px; pointer-events: none; }
      #credits { position: fixed; right: 6px; bottom: 4px; font-size: 10px; opacity: .8; max-width: 60vw; text-align: right; }
      #credits a { color: #9cf; }
      #strip { position: fixed; left: 8px; bottom: 8px; max-width: min(96vw, 1180px); background: rgba(0,0,0,.6); padding: 6px 8px; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; }
      #strip label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
      #strip input[type=range] { width: 110px; }
      #strip button, #strip select { font: inherit; padding: 3px 7px; border-radius: 4px; border: 1px solid #666; background: #222; color: #fff; cursor: pointer; }
      #strip button:hover { background: #333; }
      #strip output { min-width: 3.2em; display: inline-block; font-family: ui-monospace, monospace; }
      .bare #hud, .bare #strip, .bare #credits { display: none; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="hud">starting…</div>
    <div id="credits"></div>
    <div id="strip"></div>
    <script type="module" src="./sky.ts"></script>
  </body>
</html>
